<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Local heat source and receiving surface</title><desc id="desc">A heat source warms a small area of an object's surface directly and can radiate to nearby objects.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b75a18"/></marker></defs>
<rect width="1000" height="340" rx="16" fill="#f6f8fb"/><text x="40" y="48" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#182737">Local heat: source → receiver → IR camera</text>
<rect x="55" y="112" width="210" height="120" rx="14" fill="#fff2df" stroke="#d58a38" stroke-width="3"/><text x="160" y="153" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#533315">Thermal source</text><text x="160" y="184" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#533315">343.15 K (70 °C)</text><text x="160" y="208" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#533315">range + contact radius</text>
<path d="M275 170H370" stroke="#b75a18" stroke-width="5" marker-end="url(#arrow)"/><rect x="390" y="95" width="220" height="155" rx="14" fill="#e5ecf2" stroke="#71859b" stroke-width="3"/><rect x="458" y="109" width="84" height="12" rx="6" fill="#ef8c49"/><text x="500" y="158" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#182737">Receiver mesh</text><text x="500" y="188" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#344b5d">surface warms over time</text><text x="500" y="214" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#344b5d">baseline + local heating</text>
<path d="M620 170H715" stroke="#b75a18" stroke-width="5" marker-end="url(#arrow)"/><rect x="735" y="112" width="210" height="120" rx="14" fill="#e8e5f6" stroke="#8172b1" stroke-width="3"/><text x="840" y="153" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#2e2951">ThermalIR</text><text x="840" y="183" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#2e2951">image type 12</text><text x="840" y="208" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#2e2951">brighter ≈ warmer</text>
<text x="40" y="298" font-family="Segoe UI,Arial" font-size="16" fill="#45596b">Conceptual diagram • source temperature and surface temperature are different.</text></svg>
